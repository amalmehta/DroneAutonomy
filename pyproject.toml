[project]
name = "drone-autonomy"
version = "0.1.0"
description = "Drone Autonomy: meta-RL + classical planning, perception and mapping for quadrotors, in simulation"
requires-python = ">=3.10"
dependencies = ["numpy<2", "torch>=2.2", "gymnasium>=0.29", "matplotlib>=3.7", "pillow"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
drone-autonomy = "drone_autonomy.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drone_autonomy*"]
